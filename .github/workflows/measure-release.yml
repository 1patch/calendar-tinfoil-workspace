name: Measure Bash configuration

# An operator deliberately dispatches this workflow on an approved release tag.
# This publishes a measurement and release; it does not deploy a machine.
"on":
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: measured-bash-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  measure:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Read the exact release tag
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false

      - name: Reject an unreplaced or malformed owner public key
        shell: bash
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, re, struct
          if os.environ.get('RELEASE_REF_TYPE') != 'tag':
              raise SystemExit('Release requires an approved Git tag.')
          text = pathlib.Path('tinfoil-config.yml').read_text()
          if 'REPLACE_WITH_' in text:
              raise SystemExit('Draft owner public-key placeholder has not been replaced.')
          matches = re.findall(r'^\s*- SSH_KEYS: "(ssh-ed25519 [A-Za-z0-9+/]+=*)"\s*$', text, re.MULTILINE)
          if len(matches) != 1 or text.count('SSH_KEYS:') != 1:
              raise SystemExit('Exactly one measured inline Ed25519 public key is required.')
          encoded = matches[0].split(' ')[1]
          try:
              blob = base64.b64decode(encoded, validate=True)
          except Exception:
              raise SystemExit('Invalid owner public-key encoding.')
          if (len(blob) != 51 or struct.unpack('>I', blob[:4])[0] != 11
              or blob[4:15] != b'ssh-ed25519' or struct.unpack('>I', blob[15:19])[0] != 32
              or base64.b64encode(blob).decode() != encoded):
              raise SystemExit('Invalid owner Ed25519 public-key structure.')
          print('Measured owner public-key preflight passed.')
          PY

      - name: Measure and publish the approved configuration
        uses: tinfoilsh/measure-image-action@cb61fb5c942ae2d99a9316ada725122bd52faccd
        with:
          config-file: ${{ github.workspace }}/tinfoil-config.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
